<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0a0e17" stroke="url(#grad)" stroke-width="12" />
  
  <!-- Outer glow circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Code bracket left -->
  <path d="M 170 180 L 100 256 L 170 332" fill="none" stroke="#60a5fa" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  
  <!-- Code bracket right -->
  <path d="M 342 180 L 412 256 L 342 332" fill="none" stroke="#a78bfa" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  
  <!-- Monogram WF in center -->
  <text x="256" y="285" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="url(#grad)" text-anchor="middle" letter-spacing="-4">WF</text>
  
  <!-- Crown badge on top -->
  <polygon points="256,125 275,155 305,145 290,175 222,175 207,145 237,155" fill="#f59e0b" filter="url(#shadow)" />
</svg>
